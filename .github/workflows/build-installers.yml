name: Build Installers (.exe, .dmg)

on:
  workflow_dispatch:
  release:
    types: [published, created]
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows Installer (.exe)
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Dependencies
        run: bun install

      - name: Prepare Desktop
        shell: bash
        run: |
          cd packages/desktop
          bun ./scripts/copy-icons.ts prod
          bun ./scripts/copy-metainfo.ts prod

      - name: Build Desktop Web Assets
        shell: bash
        run: |
          cd packages/desktop
          bun run build

      - name: Package Windows Installer (.exe)
        shell: bash
        run: |
          cd packages/desktop
          npx electron-builder --win --config electron-builder.config.ts --publish never
        env:
          OPENCODE_CHANNEL: prod

      - name: Upload Windows Installer to Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'release'
        with:
          files: |
            packages/desktop/dist/*.exe
            packages/desktop/dist/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-macos:
    name: Build macOS DMG (.dmg)
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Dependencies
        run: bun install

      - name: Prepare Desktop
        run: |
          cd packages/desktop
          bun ./scripts/copy-icons.ts prod
          bun ./scripts/copy-metainfo.ts prod

      - name: Build Desktop Web Assets
        run: |
          cd packages/desktop
          bun run build

      - name: Package macOS Installer (.dmg)
        run: |
          cd packages/desktop
          npx electron-builder --mac --config electron-builder.config.ts --publish never
        env:
          OPENCODE_CHANNEL: prod

      - name: Upload macOS DMG to Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'release'
        with:
          files: |
            packages/desktop/dist/*.dmg
            packages/desktop/dist/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
